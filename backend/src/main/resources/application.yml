spring:
  application:
    name: sentinelx-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelx}
    username: ${DB_USER:sentinelx}
    password: ${DB_PASSWORD}            # no default on purpose: must come from the environment
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                # schema is owned by Flyway, never auto-generated
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

sentinelx:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo-mode: true                       # all generated data is labeled synthetic
