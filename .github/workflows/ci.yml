name: SentinelX AI Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot 3 + Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Backend Tests & Package
        working-directory: backend
        run: mvn -B clean verify

  frontend:
    name: Frontend (React 18 + Vite + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest Unit Test Suite
        working-directory: frontend
        run: npm run test

      - name: Production Bundle Build
        working-directory: frontend
        run: npm run build

  analytics:
    name: Analytics Microservice (FastAPI + ML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: analytics-service/requirements.txt

      - name: Install ML Dependencies
        working-directory: analytics-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Analytics ML Unit Tests
        working-directory: analytics-service
        run: python -m unittest test_main.py

  security-scan:
    name: DevSecOps Vulnerability & Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Security & Secrets Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Non-blocking advisory report

